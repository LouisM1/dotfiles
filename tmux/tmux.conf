# Enable mouse scrolling and pane selection
set -g mouse on

# Plugins
set -g @plugin 'tmux-plugins/tpm'

# Simple window bar at the top
set -g status-position top
set -g status-justify left
set -g status-style 'bg=default,fg=#908caa'
set -g status-left ''
set -g status-right ''
set -g window-status-format ' #I: #W '
set -g window-status-current-format ' #I: #W '
set -g window-status-style 'bg=default,fg=#908caa'
set -g window-status-current-style 'bg=default,fg=#c4a7e7,bold'
set -g window-status-separator ' '

# TPM MUST be at the bottom
run '~/.tmux/plugins/tpm/tpm'
